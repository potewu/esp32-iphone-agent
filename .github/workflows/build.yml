name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # 仅配置免签名参数，不修改任何源码
      - name: Prepare Local Config
        run: |
          mkdir -p ios/Config
          cat << 'EOF' > ios/Config/Local.xcconfig
          DEVELOPMENT_TEAM = 0000000000
          IA_BUNDLE_ID = com.personal.esp32iphoneagent
          IA_ENTITLEMENTS =
          IA_WIDGET_ENTITLEMENTS =
          IA_PRESET_BASE_URL =
          IA_PRESET_MODEL =
          IA_PRESET_KEY =
          EOF

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project ios/IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="${{ github.workspace }}/build"

      - name: Package to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "${{ github.workspace }}/build" -name "*.app" -type d | head -n 1)
          echo "Packaging: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr IPhoneAgent.ipa Payload
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-IPA
          path: IPhoneAgent.ipa
          retention-days: 7
