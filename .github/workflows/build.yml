name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    # 切换为 macos-15（默认环境已全量搭载 Xcode 16+）
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 动态选用最新的 Xcode 16+ 版本
      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selected: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Local Config
        run: |
          if [ -f ios/Config/Local.xcconfig.example ]; then
            cp ios/Config/Local.xcconfig.example ios/Config/Local.xcconfig
          else
            touch ios/Config/Local.xcconfig
          fi
          echo "DEVELOPMENT_TEAM = 0000000000" >> ios/Config/Local.xcconfig
          echo "IA_BUNDLE_ID = com.personal.esp32iphoneagent" >> ios/Config/Local.xcconfig

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project ios/IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="${{ github.workspace }}/build"

      - name: Package to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "${{ github.workspace }}/build" -name "*.app" -type d | head -n 1)
          echo "Packaging: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr IPhoneAgent.ipa Payload
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-IPA
          path: IPhoneAgent.ipa
          retention-days: 7
