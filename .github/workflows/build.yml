name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # 自动修复 AgentFace.swift 中的 cos/sin 类型模糊报错
      - name: Patch AgentFace.swift Ambiguity
        run: |
          python3 -c "
          p = 'ios/Shared/AgentFace.swift'
          with open(p, 'r', encoding='utf-8') as f:
              s = f.read()
          s = s.replace('rad * cos(a)', 'rad * CGFloat(cos(Double(a)))')
          s = s.replace('rad * sin(a)', 'rad * CGFloat(sin(Double(a)))')
          with open(p, 'w', encoding='utf-8') as f:
              f.write(s)
          print('Successfully patched AgentFace.swift')
          "

      - name: Prepare Local Config
        run: |
          mkdir -p ios/Config
          cat << 'EOF' > ios/Config/Local.xcconfig
          DEVELOPMENT_TEAM = 0000000000
          IA_BUNDLE_ID = com.personal.esp32iphoneagent
          IA_ENTITLEMENTS =
          IA_WIDGET_ENTITLEMENTS =
          IA_PRESET_BASE_URL =
          IA_PRESET_MODEL =
          IA_PRESET_KEY =
          EOF

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project ios/IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="${{ github.workspace }}/build"

      - name: Package to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "${{ github.workspace }}/build" -name "*.app" -type d | head -n 1)
          echo "Packaging: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr IPhoneAgent.ipa Payload
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-IPA
          path: IPhoneAgent.ipa
          retention-days: 7
