name: Build iOS IPA

on:
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发
  push:
    branches: [ main ]

jobs:
  build-ipa:
    # 使用 GitHub 托管的 macOS 14 运行器（预装了 Xcode 16 及以上）
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Local Config
        run: |
          if [ -f ios/Config/Local.xcconfig.example ]; then
            cp ios/Config/Local.xcconfig.example ios/Config/Local.xcconfig
          else
            touch ios/Config/Local.xcconfig
          fi
          # 写入占位配置（后续由 Sideloadly 重新签名）
          echo "DEVELOPMENT_TEAM = 0000000000" >> ios/Config/Local.xcconfig
          echo "IA_BUNDLE_ID = com.personal.esp32iphoneagent" >> ios/Config/Local.xcconfig

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project ios/IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="${{ github.workspace }}/build"

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # 找到编译出来的 .app 目录并打包
          APP_PATH=$(find "${{ github.workspace }}/build" -name "*.app" -type d | head -n 1)
          echo "Packaging: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr IPhoneAgent.ipa Payload
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-IPA
          path: IPhoneAgent.ipa
          retention-days: 7
